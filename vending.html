<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Web自動販売機</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="vending-machine">
        <h2>🥤 Web自動販売機</h2>
        
        <div id="menu-area"></div>

        <div class="form-group">
            <label for="money-input">1. お金を投入（円）:</label>
            <input type="number" id="money-input" placeholder="例: 500">
        </div>

        <div class="form-group">
            <label for="product-select">2. 商品を選択:</label>
            <select id="product-select">
                <option value="">-- 商品を選んでください --</option>
            </select>
        </div>

        <button onclick="VendingMachine()">購入ボタンを押す</button>

        <h3>コンソール出力</h3>
        <div id="output">お金を入れて商品を選び、購入ボタンを押してください。</div>
    </div>

    <script src="zihanki.js"></script>
    <script>
        // ページが読み込まれたら、JS側にあるメニュー表示関数を即座に実行する
        Menu();
    </script>
</body>
</html>
